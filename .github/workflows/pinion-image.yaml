name: Pinion image

# Builds the Pinion fork of Twenty into a container image on a GitHub runner and publishes it to GHCR.
#
# Why CI and not the production host: a full monorepo build needs several GB of RAM, and the host that runs the live CRM
# has little to spare. Building here also gives every image a reproducible, reviewable origin (this commit, this
# workflow run) instead of "whatever the box had".
#
# Image:  ghcr.io/<owner>/twenty-pinion:<app-version>-pinion.<short-sha>
#   e.g.  ghcr.io/muneebgawri/twenty-pinion:2.46.0-pinion.928aff6
# There is deliberately NO moving tag (no `latest`, no `main`): a deploy must name one exact build.
#
# What this image is: stock Twenty at the pinned upstream commit (see docs/PINION_FORK.md) plus the divergences listed
# there. It does NOT contain the Pinion overlay patches (row-level security, email gate, Google OAuth); those are
# layered on top of this image by deploy/branding. It is not deployed by this workflow.
#
# RELEASE LINE: `main` upstream is the NEXT, unreleased version. An image built from an unreleased snapshot would run
# that version's unreleased database migrations on whatever database it starts against, and migrations cannot be run
# backwards. Only deploy an image whose app version is a released Twenty version.

on:
  push:
    branches: [pinion/main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (default: the branch dispatched on)'
        required: false
        type: string

concurrency:
  group: pinion-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything the fork adds must pass before an image is built from it.
  verify:
    name: Verify the fork's changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Build twenty-shared
        run: npx nx build twenty-shared

      - name: Typecheck twenty-front
        run: npx nx typecheck twenty-front

      - name: Test the Pinion modules
        run: npx jest packages/twenty-front/src/modules/pinion --config=packages/twenty-front/jest.config.mjs

      - name: Lint and format the Pinion modules
        run: |
          npx nx build twenty-oxlint-rules
          cd packages/twenty-front
          npx oxlint --type-aware -c .oxlintrc.json src/modules/pinion
          npx oxfmt --check src/modules/pinion

  image:
    name: Build and publish the image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve what is being built
        id: build
        run: |
          # Twenty's version lives in this generated constant (upstream: `npx nx version:bump twenty-server`), which is
          # also what its upgrade logic compares against. No package.json carries it.
          app_version="$(grep -oE "TWENTY_CURRENT_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" \
            packages/twenty-server/src/engine/core-modules/upgrade/constants/twenty-current-version.constant.ts \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          # The first 40-hex string in the fork doc is the pinned upstream commit (its "Base" table).
          upstream_base="$(grep -oE '[0-9a-f]{40}' docs/PINION_FORK.md | head -1 || true)"
          # Never publish an image whose version or base could not be read: APP_VERSION is baked into it and drives
          # the instance's upgrade logic, so a wrong value is worse than a failed build.
          [[ "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::could not read the Twenty version (got '${app_version}')"; exit 1; }
          [[ "${upstream_base}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read the upstream base commit from docs/PINION_FORK.md"; exit 1; }
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${app_version}-pinion.${short_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_base=${upstream_base}" >> "$GITHUB_OUTPUT"

      # Pull base images through Google's Docker Hub mirror: avoids Docker Hub rate limits and needs no credentials.
      # Same approach as upstream's own docker CI.
      - name: Configure Docker Hub mirror
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/twenty-pinion
          tags: type=raw,value=${{ steps.build.outputs.tag }}
          labels: |
            io.pinion.upstream-base=${{ steps.build.outputs.upstream_base }}
            io.pinion.app-version=${{ steps.build.outputs.app_version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./packages/twenty-docker/twenty/Dockerfile
          # The Dockerfile has several final stages (aws, app-dev, ...); `twenty` is the one upstream ships.
          target: twenty
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.build.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pinion image published"
            echo ""
            echo "- **Image:** \`ghcr.io/${{ github.repository_owner }}/twenty-pinion:${{ steps.build.outputs.tag }}\`"
            echo "- **Digest:** \`${{ steps.push.outputs.digest }}\`"
            echo "- **Twenty version:** \`${{ steps.build.outputs.app_version }}\`"
            echo "- **Upstream base commit:** \`${{ steps.build.outputs.upstream_base }}\`"
            echo ""
            echo "Deploy only if the Twenty version above is a **released** version (see the header of this workflow)."
          } >> "$GITHUB_STEP_SUMMARY"
